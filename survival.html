<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survival Craft UI</title>
  <link rel="stylesheet" href="survival.css">
</head>
<body>
  <main class="frame">
    <section class="panel">
      <div class="avatar">
        <div class="avatar-box">Avatar image</div>
        <div class="stat">Health:</div>
        <div class="stat">Hunger:</div>
      </div>
    </section>

    <section class="panel">
      <div class="tabs" id="tabList">
        <div class="tab active" data-location="Base">Base</div>
        <div class="tab" data-location="Forest">Forest</div>
        <div class="tab" data-location="Underground">Underground</div>
        <div class="tab" data-location="Plains">Plains</div>
      </div>
    </section>

    <section class="content" id="content">
      <div class="location-title">Base</div>
      <div class="actions">
        <button class="action">Action 1</button>
        <button class="action">Action 2</button>
        <button class="action">Action 3</button>
      </div>
    </section>
  </main>

  <script>
    const locations = {
      Base: ['Action 1', 'Action 2', 'Action 3'],
      Forest: ['Action 1', 'Action 2', 'Action 3'],
      Underground: ['Action 1', 'Action 2', 'Action 3'],
      Plains: ['Action 1', 'Action 2', 'Action 3']
    };

    const tabList = document.getElementById('tabList');
    const content = document.getElementById('content');

    tabList.addEventListener('click', (event) => {
      const tab = event.target.closest('.tab');
      if (!tab) return;

      const location = tab.dataset.location;
      if (!location || !locations[location]) return;

      document.querySelectorAll('.tab').forEach((node) => node.classList.remove('active'));
      tab.classList.add('active');
      renderLocation(location);
    });

    function renderLocation(location) {
      content.innerHTML = '';
      const title = document.createElement('div');
      title.className = 'location-title';
      title.textContent = location;

      const actionsWrap = document.createElement('div');
      actionsWrap.className = 'actions';

      locations[location].forEach((actionLabel) => {
        const button = document.createElement('button');
        button.className = 'action';
        button.textContent = actionLabel;
        actionsWrap.appendChild(button);
      });

      content.appendChild(title);
      content.appendChild(actionsWrap);
    }
  </script>
</body>
</html>
