<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survival Craft UI</title>
  <style>
    :root {
      --border-color: #1f1f1f;
      --background: #fefefe;
      --panel-padding: 12px;
      --accent: #2d5d7b;
      --muted: #4d4d4d;
      --font: 'Segoe UI', Tahoma, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f2f2f2;
      font-family: var(--font);
      color: #0d0d0d;
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .frame {
      display: grid;
      grid-template-columns: 220px 140px 1fr;
      grid-template-rows: 1fr;
      border: 2px solid var(--border-color);
      background: var(--background);
      min-height: 520px;
      width: min(100%, 980px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.1);
    }

    .panel {
      border-right: 2px solid var(--border-color);
      padding: var(--panel-padding);
    }

    .panel:last-child {
      border-right: none;
    }

    .avatar {
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: 100%;
    }

    .avatar-box {
      border: 2px solid var(--border-color);
      background: linear-gradient(135deg, #ededed 0%, #ffffff 80%);
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: var(--muted);
    }

    .stat {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .tabs {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .tab {
      padding: 10px 12px;
      border: 2px solid var(--border-color);
      background: #f8f8f8;
      text-align: center;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      user-select: none;
    }

    .tab:hover {
      background: #e6f0f7;
      border-color: var(--accent);
      color: var(--accent);
    }

    .tab.active {
      background: #dfeffc;
      border-color: var(--accent);
      color: #0d2c42;
    }

    .content {
      padding: var(--panel-padding);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .location-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0d2c42;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .action {
      border: 2px solid var(--border-color);
      padding: 10px 16px;
      font-weight: 700;
      background: #fafafa;
      cursor: pointer;
      letter-spacing: 0.02em;
      box-shadow: inset 0 0 0 2px #ffffff;
      transition: transform 0.1s, box-shadow 0.1s, border-color 0.1s;
    }

    .action::before {
      content: '[';
      margin-right: 6px;
      color: var(--muted);
    }

    .action::after {
      content: ']';
      margin-left: 6px;
      color: var(--muted);
    }

    .action:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
      box-shadow: inset 0 0 0 2px #e8f3ff;
    }

    @media (max-width: 900px) {
      body {
        padding: 12px;
      }

      .frame {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
      }

      .panel {
        border-right: none;
        border-bottom: 2px solid var(--border-color);
      }

      .panel:last-child {
        border-bottom: none;
      }

      .tabs {
        flex-direction: row;
      }

      .tab {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <main class="frame">
    <section class="panel">
      <div class="avatar">
        <div class="avatar-box">Avatar image</div>
        <div class="stat">Health:</div>
        <div class="stat">Hunger:</div>
      </div>
    </section>

    <section class="panel">
      <div class="tabs" id="tabList">
        <div class="tab active" data-location="Base">Base</div>
        <div class="tab" data-location="Forest">Forest</div>
        <div class="tab" data-location="Underground">Underground</div>
        <div class="tab" data-location="Plains">Plains</div>
      </div>
    </section>

    <section class="content" id="content">
      <div class="location-title">Base</div>
      <div class="actions">
        <button class="action">Action 1</button>
        <button class="action">Action 2</button>
        <button class="action">Action 3</button>
      </div>
    </section>
  </main>

  <script>
    const locations = {
      Base: ['Action 1', 'Action 2', 'Action 3'],
      Forest: ['Action 1', 'Action 2', 'Action 3'],
      Underground: ['Action 1', 'Action 2', 'Action 3'],
      Plains: ['Action 1', 'Action 2', 'Action 3']
    };

    const tabList = document.getElementById('tabList');
    const content = document.getElementById('content');

    tabList.addEventListener('click', (event) => {
      const tab = event.target.closest('.tab');
      if (!tab) return;

      const location = tab.dataset.location;
      if (!location || !locations[location]) return;

      document.querySelectorAll('.tab').forEach((node) => node.classList.remove('active'));
      tab.classList.add('active');
      renderLocation(location);
    });

    function renderLocation(location) {
      content.innerHTML = '';
      const title = document.createElement('div');
      title.className = 'location-title';
      title.textContent = location;

      const actionsWrap = document.createElement('div');
      actionsWrap.className = 'actions';

      locations[location].forEach((actionLabel) => {
        const button = document.createElement('button');
        button.className = 'action';
        button.textContent = actionLabel;
        actionsWrap.appendChild(button);
      });

      content.appendChild(title);
      content.appendChild(actionsWrap);
    }
  </script>
</body>
</html>
